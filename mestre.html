<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andromeda — Painel do Mestre</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mestre.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<canvas class="stars" id="starfield"></canvas>
<div class="mwrap">
  <header class="mhead">
    <div><h1>Painel do Mestre</h1><p><span class="live"></span>Ao vivo · o que você alterar aparece na ficha do jogador na hora</p></div>
    <div class="mtools">
      <button class="btn" data-a="lockall">Travar rolagem de todos</button>
      <button class="btn ghost" data-a="unlockall">Liberar todos</button>
      <a class="btn ghost" href="index.html" target="_blank">Abrir ficha</a>
    </div>
  </header>
  <div id="grid" class="mgrid"><div class="empty">Carregando fichas…</div></div>
</div>
<div id="scrim" data-a="close"></div>
<aside id="drawer" aria-label="Ficha selecionada"></aside>
<script src="shared.js"></script>
<script src="mestre.js"></script>
</body>
</html>
